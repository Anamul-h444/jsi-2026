name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # ব্রাউজার যেন পুরোনো CSS/JS ক্যাশ থেকে না দেখায়: প্রতিটি ডিপ্লয়ে নতুন ভার্সন নম্বর
      - name: Cache-busting version
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html && sed -i "s/jsi2026-v1/jsi2026-${GITHUB_SHA::8}/" sw.js
      # লিংক প্রিভিউয়ের জন্য সাইটের পূর্ণ ঠিকানা (রিপোর নাম বদলালেও নিজে থেকে ঠিক হয়)
      - name: Site URL for link previews
        run: |
          SITE="https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z').github.io/${GITHUB_REPOSITORY#*/}/"
          sed -i "s#__SITE__#${SITE}#g" index.html
          grep -o 'og:url" content="[^"]*' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
